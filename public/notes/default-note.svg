<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="defnote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a16" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#141834" />
    </linearGradient>
    <linearGradient id="card-defnote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1124" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid-defnote" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#818cf8" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#defnote-bg)" />
  <rect width="1200" height="675" fill="url(#grid-defnote)" />

  <circle cx="280" cy="180" r="260" fill="#818cf8" fill-opacity="0.12" filter="blur(70px)" />
  <circle cx="950" cy="460" r="260" fill="#00ddb3" fill-opacity="0.08" filter="blur(80px)" />

  <rect x="24" y="24" width="1152" height="627" rx="20" stroke="#312e81" stroke-width="1.5" />

  <g transform="translate(60, 56)">
    <rect width="1080" height="562" rx="14" fill="#080c1a" stroke="#1e293b" stroke-width="1.5" />

    <rect width="1080" height="48" rx="14" fill="#0f172a" />
    <path d="M0 48h1080" stroke="#1e293b" stroke-width="1" />

    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <rect x="96" y="10" width="380" height="28" rx="6" fill="#080c1a" stroke="#1e293b" stroke-width="1" />
    <text x="116" y="28" fill="#94a3b8" font-family="monospace" font-size="12">engineering-notes/field-report.md</text>

    <rect x="900" y="12" width="154" height="24" rx="12" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="914" cy="24" r="3.5" fill="#818cf8" />
    <text x="926" y="28" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">FIELD REPORT</text>

    <!-- Center Notebook / Code Stage -->
    <g transform="translate(36, 76)">
      <rect width="1008" height="290" rx="10" fill="url(#card-defnote)" stroke="#312e81" stroke-width="1" />

      <text x="28" y="32" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">TECHNICAL ESSAY &amp; ARCHITECTURAL SPECIFICATION</text>

      <!-- Code / Markdown Pane -->
      <g transform="translate(28, 56)">
        <rect width="952" height="206" rx="8" fill="#070a16" stroke="#1e293b" stroke-width="1" />
        
        <text x="20" y="32" fill="#818cf8" font-family="monospace" font-size="13"># Architectural Deep-Dive &amp; Empirical Findings</text>
        <text x="20" y="60" fill="#94a3b8" font-family="monospace" font-size="12">## 1. Executive Summary &amp; System Constraints</text>
        <text x="20" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="13">Detailed analysis documenting production incidents, scaling tradeoffs, algorithmic optimizations, and best practices.</text>
        
        <text x="20" y="120" fill="#94a3b8" font-family="monospace" font-size="12">## 2. Key Engineering Principles</text>
        <text x="20" y="146" fill="#34d399" font-family="monospace" font-size="12">• Separation of Concerns: Decouple domain validation from routing and presentation</text>
        <text x="20" y="170" fill="#38bdf8" font-family="monospace" font-size="12">• Stateless Authorization: Secure, high-throughput JWT validation</text>
        <text x="20" y="194" fill="#f59e0b" font-family="monospace" font-size="12">• Measurable Benchmarks: Verify performance gains through reproducible metrics</text>
      </g>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(36, 388)">
      <rect width="1008" height="142" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      
      <g transform="translate(30, 28)">
        <text x="0" y="26" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">Engineering Field Report</text>
        <text x="0" y="52" fill="#94a3b8" font-family="sans-serif" font-size="13">Technical writing on software design, distributed systems, RESTful APIs, and database engineering.</text>
        
        <g transform="translate(0, 68)">
          <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b" />
          <text x="65" y="16" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="600">ARCHITECTURE</text>

          <rect x="140" y="0" width="120" height="24" rx="4" fill="#1e293b" />
          <text x="200" y="16" text-anchor="middle" fill="#00ddb3" font-family="monospace" font-size="11" font-weight="600">SYSTEM DESIGN</text>

          <rect x="270" y="0" width="130" height="24" rx="4" fill="#1e293b" />
          <text x="335" y="16" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">POST-MORTEM</text>

          <rect x="410" y="0" width="120" height="24" rx="4" fill="#1e293b" />
          <text x="470" y="16" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">BEST PRACTICES</text>
        </g>
      </g>

      <!-- Book / Quill Emblem -->
      <g transform="translate(900, 22)">
        <circle cx="48" cy="48" r="44" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
        <path d="M34 36 L48 30 L62 36 V62 L48 56 L34 62 Z" fill="#818cf8" />
        <line x1="48" y1="30" x2="48" y2="56" stroke="#080c1a" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
