        <text x="20" y="60" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-style="italic">but someone out there might understand."</text>
        <text x="20" y="100" fill="#94a3b8" font-family="monospace" font-size="11">#confession #late-night · 2m ago · 48 reactions</text>
