<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crimson-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00ddb3" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="220" fill="url(#glow-grad)" filter="blur(60px)" />
  <circle cx="1050" cy="500" r="250" fill="#00ddb3" fill-opacity="0.06" filter="blur(80px)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="20" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Browser / UI Window Shell -->
  <g transform="translate(60, 56)">
    <!-- Window Bar -->
    <rect width="1080" height="562" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top Chrome Header -->
    <rect width="1080" height="48" rx="14" fill="#0f172a" />
    <path d="M0 48h1080" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="96" y="10" width="440" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="116" y="28" fill="#94a3b8" font-family="monospace" font-size="12">https://borejak.health/portal/donor-eligibility</text>

    <!-- Header Status Badge -->
    <rect x="910" y="12" width="144" height="24" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="924" cy="24" r="3.5" fill="#ef4444" />
    <text x="936" y="28" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">LIVE TELEMETRY</text>

    <!-- Dashboard Content Grid -->
    <!-- Card 1: Donor Status & ECG -->
    <g transform="translate(36, 76)">
      <rect width="600" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      
      <!-- Card Title -->
      <text x="24" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">DONOR TRIAGE VERIFICATION</text>
      <text x="24" y="68" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Eligible For Immediate Donation</text>
      
      <!-- Pill Badges -->
      <rect x="24" y="86" width="100" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
      <text x="36" y="103" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">ACID VERIFIED</text>

      <rect x="134" y="86" width="130" height="26" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.3" />
      <text x="146" y="103" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">QUESTIONNAIRE: 100%</text>

      <!-- ECG Heartbeat Curve -->
      <path d="M 24 200 L 120 200 L 140 180 L 155 230 L 180 120 L 205 240 L 220 190 L 235 200 L 340 200 L 355 180 L 370 230 L 395 120 L 420 240 L 435 190 L 450 200 L 576 200" 
            stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Grid guide lines behind ECG -->
      <line x1="24" y1="160" x2="576" y2="160" stroke="#334155" stroke-opacity="0.3" stroke-dasharray="4 4" />
      <line x1="24" y1="200" x2="576" y2="200" stroke="#334155" stroke-opacity="0.3" />
      <line x1="24" y1="240" x2="576" y2="240" stroke="#334155" stroke-opacity="0.3" stroke-dasharray="4 4" />

      <!-- Stats Footer -->
      <text x="24" y="258" fill="#64748b" font-family="monospace" font-size="11">Hemoglobin: <tspan fill="#38bdf8">14.8 g/dL</tspan></text>
      <text x="220" y="258" fill="#64748b" font-family="monospace" font-size="11">Blood Pressure: <tspan fill="#38bdf8">118/76 mmHg</tspan></text>
      <text x="440" y="258" fill="#64748b" font-family="monospace" font-size="11">Weight: <tspan fill="#38bdf8">68 kg</tspan></text>
    </g>

    <!-- Card 2: Blood Bank Inventory Metrics -->
    <g transform="translate(660, 76)">
      <rect width="384" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      
      <text x="24" y="36" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">HOSPITAL BLOOD RESERVES</text>
      <text x="24" y="68" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">Real-Time Inventory</text>

      <!-- Blood Types Progress -->
      <!-- O+ -->
      <g transform="translate(24, 95)">
        <text x="0" y="16" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">O+ Universal</text>
        <text x="336" y="16" text-anchor="end" fill="#f87171" font-family="monospace" font-size="12">Critical (18%)</text>
        <rect x="0" y="26" width="336" height="8" rx="4" fill="#1e293b" />
        <rect x="0" y="26" width="60" height="8" rx="4" fill="#ef4444" />
      </g>

      <!-- A+ -->
      <g transform="translate(24, 145)">
        <text x="0" y="16" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">A+ Positive</text>
        <text x="336" y="16" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="12">Stable (72%)</text>
        <rect x="0" y="26" width="336" height="8" rx="4" fill="#1e293b" />
        <rect x="0" y="26" width="242" height="8" rx="4" fill="#06b6d4" />
      </g>

      <!-- B+ -->
      <g transform="translate(24, 195)">
        <text x="0" y="16" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700">B+ Positive</text>
        <text x="336" y="16" text-anchor="end" fill="#34d399" font-family="monospace" font-size="12">Optimal (88%)</text>
        <rect x="0" y="26" width="336" height="8" rx="4" fill="#1e293b" />
        <rect x="0" y="26" width="295" height="8" rx="4" fill="#10b981" />
      </g>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(36, 380)">
      <rect width="1008" height="150" rx="12" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
      
      <!-- Project Title & Description -->
      <g transform="translate(30, 32)">
        <text x="0" y="28" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Borejak — Blood Donation Platform</text>
        <text x="0" y="58" fill="#94a3b8" font-family="sans-serif" font-size="14">Automated donor eligibility pre-screening, emergency hospital dispatch queues &amp; PostgreSQL ACID storage.</text>
        
        <!-- Tech Stack Tags -->
        <g transform="translate(0, 78)">
          <rect x="0" y="0" width="76" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="38" y="16" text-anchor="middle" fill="#00ddb3" font-family="monospace" font-size="11" font-weight="600">Next.js</text>

          <rect x="86" y="0" width="76" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="124" y="16" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">Node.js</text>

          <rect x="172" y="0" width="100" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="222" y="16" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="600">PostgreSQL</text>

          <rect x="282" y="0" width="112" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="338" y="16" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">Firebase Auth</text>

          <rect x="404" y="0" width="94" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="451" y="16" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">Tailwind CSS</text>
        </g>
      </g>

      <!-- Blood Drop Emblem -->
      <g transform="translate(900, 25)">
        <circle cx="48" cy="48" r="44" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5" />
        <!-- Drop icon -->
        <path d="M48 24 C48 24 30 46 30 57 C30 67 38 75 48 75 C58 75 66 67 66 57 C66 46 48 24 48 24 Z" fill="#ef4444" />
      </g>
    </g>
  </g>
</svg>
