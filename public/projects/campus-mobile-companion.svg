<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mobile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card-mobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="grid-mob" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#mobile-bg)" />
  <rect width="1200" height="675" fill="url(#grid-mob)" />

  <circle cx="280" cy="180" r="260" fill="#38bdf8" fill-opacity="0.1" filter="blur(70px)" />
  <circle cx="950" cy="460" r="260" fill="#818cf8" fill-opacity="0.08" filter="blur(80px)" />

  <rect x="24" y="24" width="1152" height="627" rx="20" stroke="#334155" stroke-width="1.5" />

  <g transform="translate(60, 56)">
    <rect width="1080" height="562" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

    <rect width="1080" height="48" rx="14" fill="#0f172a" />
    <path d="M0 48h1080" stroke="#1e293b" stroke-width="1" />

    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <rect x="96" y="10" width="380" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="116" y="28" fill="#94a3b8" font-family="monospace" font-size="12">flutter run --release -d android-pixel8</text>

    <rect x="910" y="12" width="144" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="924" cy="24" r="3.5" fill="#38bdf8" />
    <text x="936" y="28" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">OFFLINE FIRST SYNC</text>

    <!-- Left Box: Mobile Phone Frame Mockup -->
    <g transform="translate(100, 76)">
      <!-- Phone Body -->
      <rect width="240" height="290" rx="24" fill="#020617" stroke="#334155" stroke-width="2" />
      
      <!-- Phone Notch / Camera -->
      <rect x="80" y="8" width="80" height="12" rx="6" fill="#0f172a" />
      <circle cx="140" cy="14" r="3" fill="#1e293b" />

      <!-- Screen Content -->
      <g transform="translate(16, 32)">
        <text x="0" y="16" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Today's Classes</text>
        <text x="0" y="28" fill="#38bdf8" font-family="monospace" font-size="9">RUPP IT Dept • Semester 6</text>

        <!-- Timetable Item 1 -->
        <g transform="translate(0, 40)">
          <rect width="208" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
          <text x="10" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Computer Networks</text>
          <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="9">08:00 - 10:00 AM • Room 302</text>
          <text x="10" y="44" fill="#34d399" font-family="monospace" font-size="8">Status: In Progress</text>
        </g>

        <!-- Timetable Item 2 -->
        <g transform="translate(0, 100)">
          <rect width="208" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="10" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Database System Lab</text>
          <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="9">10:30 - 12:00 PM • Lab 2</text>
          <text x="10" y="44" fill="#38bdf8" font-family="monospace" font-size="8">Status: Upcoming</text>
        </g>

        <!-- Timetable Item 3 -->
        <g transform="translate(0, 160)">
          <rect width="208" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="10" y="16" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Software Architecture</text>
          <text x="10" y="30" fill="#94a3b8" font-family="monospace" font-size="9">02:00 - 04:00 PM • Room 405</text>
        </g>
      </g>
    </g>

    <!-- Center/Right Box: Architecture & Cloud Sync -->
    <g transform="translate(400, 76)">
      <rect width="610" height="290" rx="10" fill="url(#card-mobile)" stroke="#334155" stroke-width="1" />

      <text x="24" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">MOBILE ARCHITECTURE &amp; SYNC PIPELINE</text>
      <text x="24" y="64" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">Offline-First BLoC State Management</text>

      <!-- Architecture Pipeline Diagram -->
      <g transform="translate(24, 88)">
        <!-- Node 1: UI View -->
        <rect width="160" height="64" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="80" y="26" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">Flutter UI</text>
        <text x="80" y="46" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">BLoC Presentation</text>

        <!-- Arrow -->
        <path d="M 160 32 L 200 32" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />

        <!-- Node 2: Repository -->
        <g transform="translate(200, 0)">
          <rect width="160" height="64" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
          <text x="80" y="26" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="700">Repository Layer</text>
          <text x="80" y="46" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Offline Resolver</text>
        </g>

        <!-- Arrow -->
        <path d="M 360 32 L 400 32" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" />

        <!-- Node 3: Cloud Firestore -->
        <g transform="translate(400, 0)">
          <rect width="160" height="64" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
          <text x="80" y="26" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">Firebase Cloud</text>
          <text x="80" y="46" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Real-Time Streams</text>
        </g>
      </g>

      <!-- Offline Feature List -->
      <g transform="translate(24, 180)">
        <text x="0" y="16" fill="#34d399" font-family="monospace" font-size="12">✓ Local SQLite &amp; SharedPreferences cache for offline timetable viewing</text>
        <text x="0" y="38" fill="#38bdf8" font-family="monospace" font-size="12">✓ Automated WebSocket reconnect and cloud delta synchronization</text>
        <text x="0" y="60" fill="#a78bfa" font-family="monospace" font-size="12">✓ Cross-platform compilation for Android and iOS devices</text>
      </g>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(36, 388)">
      <rect width="1008" height="142" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      
      <g transform="translate(30, 28)">
        <text x="0" y="26" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="800">Campus Mobile Companion</text>
        <text x="0" y="52" fill="#94a3b8" font-family="sans-serif" font-size="13">University student utility app featuring real-time timetables, urgent department alerts &amp; offline persistence.</text>
        
        <g transform="translate(0, 68)">
          <rect x="0" y="0" width="80" height="24" rx="4" fill="#1e293b" />
          <text x="40" y="16" text-anchor="middle" fill="#0284c7" font-family="monospace" font-size="11" font-weight="600">Flutter</text>

          <rect x="90" y="0" width="70" height="24" rx="4" fill="#1e293b" />
          <text x="125" y="16" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">Dart</text>

          <rect x="170" y="0" width="130" height="24" rx="4" fill="#1e293b" />
          <text x="235" y="16" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600">Firebase Firestore</text>

          <rect x="310" y="0" width="110" height="24" rx="4" fill="#1e293b" />
          <text x="365" y="16" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600">BLoC Pattern</text>

          <rect x="430" y="0" width="110" height="24" rx="4" fill="#1e293b" />
          <text x="485" y="16" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">Offline Caching</text>
        </g>
      </g>

      <!-- Smartphone Emblem -->
      <g transform="translate(900, 22)">
        <circle cx="48" cy="48" r="44" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
        <rect x="36" y="28" width="24" height="40" rx="4" fill="none" stroke="#38bdf8" stroke-width="2" />
        <circle cx="48" cy="62" r="1.5" fill="#38bdf8" />
        <line x1="44" y1="32" x2="52" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
