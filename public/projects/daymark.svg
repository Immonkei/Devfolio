<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-daymark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-daymark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="grid-daymark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818cf8" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-daymark)" />
  <rect width="1200" height="675" fill="url(#grid-daymark)" />

  <circle cx="200" cy="180" r="250" fill="#6366f1" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="480" r="260" fill="#818cf8" fill-opacity="0.1" filter="blur(80px)" />

  <rect x="24" y="24" width="1152" height="627" rx="20" stroke="#312e81" stroke-width="1.5" />

  <g transform="translate(60, 56)">
    <rect width="1080" height="562" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />

    <rect width="1080" height="48" rx="14" fill="#0f172a" />
    <path d="M0 48h1080" stroke="#1e293b" stroke-width="1" />

    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <rect x="96" y="10" width="340" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <text x="116" y="28" fill="#c7d2fe" font-family="monospace" font-size="12">https://daymark.app/habits/streaks</text>

    <rect x="880" y="12" width="174" height="24" rx="12" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="894" cy="24" r="3.5" fill="#818cf8" />
    <text x="906" y="28" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">HABIT TRACKER PWA</text>

    <!-- Content Area -->
    <g transform="translate(36, 74)">
      <rect width="620" height="300" rx="10" fill="url(#card-daymark)" stroke="#312e81" stroke-width="1" />
      <text x="24" y="32" fill="#818cf8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">DAILY STREAK ENGINE</text>

      <g transform="translate(24, 52)">
        <rect width="572" height="110" rx="8" fill="#0f172a" stroke="#1e293b" />
        <text x="16" y="28" fill="#818cf8" font-family="monospace" font-size="11">COMMIT STREAK HEATMAP</text>
        <!-- Mini habit squares -->
        <g transform="translate(16, 42)">
          <rect x="0" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="22" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="44" y="0" width="16" height="16" rx="3" fill="#a5b4fc" />
          <rect x="66" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="88" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="110" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="132" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="154" y="0" width="16" height="16" rx="3" fill="#4f46e5" />
          <rect x="176" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="198" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="220" y="0" width="16" height="16" rx="3" fill="#c7d2fe" />
          <rect x="242" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="264" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="286" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="308" y="0" width="16" height="16" rx="3" fill="#4f46e5" />
          <rect x="330" y="0" width="16" height="16" rx="3" fill="#818cf8" />
          <rect x="352" y="0" width="16" height="16" rx="3" fill="#6366f1" />
          <rect x="374" y="0" width="16" height="16" rx="3" fill="#818cf8" />
        </g>
        <text x="16" y="92" fill="#34d399" font-family="monospace" font-size="11">Current Streak: 42 Days Active</text>
        <text x="360" y="92" fill="#c7d2fe" font-family="monospace" font-size="11">Completion: 94.2%</text>
      </g>

      <g transform="translate(24, 180)">
        <rect width="276" height="96" rx="8" fill="#0f172a" stroke="#1e293b" />
        <text x="16" y="28" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">OFFLINE PWA CACHE</text>
        <text x="16" y="52" fill="#e2e8f0" font-family="monospace" font-size="11">Service Worker Ready</text>
        <text x="16" y="74" fill="#94a3b8" font-family="monospace" font-size="10">Local SQLite / IndexedDB</text>
      </g>

      <g transform="translate(320, 180)">
        <rect width="276" height="96" rx="8" fill="#0f172a" stroke="#1e293b" />
        <text x="16" y="28" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">OPTIMISTIC MUTATIONS</text>
        <text x="16" y="52" fill="#34d399" font-family="monospace" font-size="11">Zero-Latency Toggle</text>
        <text x="16" y="74" fill="#94a3b8" font-family="monospace" font-size="10">Background Sync to Supabase</text>
      </g>

      <!-- Right: Technical Stack -->
      <g transform="translate(644, 0)">
        <rect width="364" height="300" rx="10" fill="url(#card-daymark)" stroke="#312e81" stroke-width="1" />
        <text x="24" y="32" fill="#818cf8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">PWA ARCHITECTURE</text>

        <g transform="translate(24, 52)">
          <rect width="316" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
          <text x="14" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12">Next.js App Router + TypeScript</text>
        </g>
        <g transform="translate(24, 104)">
          <rect width="316" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
          <text x="14" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12">Tailwind CSS + Lucide</text>
        </g>
        <g transform="translate(24, 156)">
          <rect width="316" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
          <text x="14" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12">Supabase PostgreSQL + RLS</text>
        </g>
        <g transform="translate(24, 208)">
          <rect width="316" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
          <text x="14" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12">Progressive Web App (PWA)</text>
        </g>
      </g>
    </g>

    <!-- Bottom Metric Ticker -->
    <g transform="translate(36, 400)">
      <rect width="1008" height="66" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="28" y="38" fill="#94a3b8" font-family="monospace" font-size="11">CAPABILITIES</text>
      <text x="160" y="38" fill="#6366f1" font-family="monospace" font-size="12" font-weight="700">OFFLINE FIRST PWA</text>
      <text x="360" y="38" fill="#818cf8" font-family="monospace" font-size="12" font-weight="700">OPTIMISTIC MUTATIONS</text>
      <text x="600" y="38" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">STREAK HEATMAP</text>
      <text x="860" y="38" fill="#f8fafc" font-family="monospace" font-size="12">Min Phanith</text>
    </g>
